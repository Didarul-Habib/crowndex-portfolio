<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0B0F" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (() => {
        const allowed = ['gold', 'crimson', 'teal', 'neon', 'lime', 'light'];
        const requested = new URLSearchParams(location.search).get('theme');
        document.documentElement.dataset.cdxTheme = allowed.includes(requested) ? requested : 'gold';
      })();
    </script>

    <title>CrownDEX — AI Films & Product Visuals</title>
    <meta
      name="description"
      content="CrownDEX creates AI short films, funny shorts and product advertisements — from first concept to final cut."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CrownDEX" />
    <meta property="og:url" content="https://crowndex.pages.dev/" />
    <meta property="og:title" content="CrownDEX — Stories in Motion." />

      property="og:description"

    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"
      content="AI films and product visuals, from first concept to final cut."

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
